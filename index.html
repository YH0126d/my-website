<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球城市关系可视化平台</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;background:#06121f;}
#map{width:100%;height:100%;}
body::before{
    content:"";position:absolute;width:100%;height:100%;
    background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,0.15) 1px,transparent 1px),
    radial-gradient(circle at 70% 40%,rgba(255,255,255,0.15) 1px,transparent 1px),
    radial-gradient(circle at 40% 70%,rgba(255,255,255,0.15) 1px,transparent 1px);
    background-size:220px 220px;z-index:1;pointer-events:none;
}
.header{
    position:absolute;top:20px;left:50%;transform:translateX(-50%);
    z-index:999;padding:18px 42px;border-radius:18px;background:rgba(0,0,0,0.35);
    backdrop-filter:blur(18px);color:#00ffff;font-size:32px;font-weight:bold;
    text-shadow:0 0 15px #00ffff,0 0 25px #00aaff;
    box-shadow:0 0 30px rgba(22,119,255,0.5);border:1px solid rgba(255,255,255,0.15);
}
.sidebar{
    position:absolute;top:110px;left:20px;width:360px;z-index:999;
    background:rgba(10,25,40,0.78);backdrop-filter:blur(18px);
    border-radius:24px;padding:24px;border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 8px 30px rgba(0,0,0,0.45);color:#00ffff;
}
.sidebar h2{margin-bottom:20px;font-size:28px;}
.input-box{width:100%;padding:16px;border:none;outline:none;border-radius:14px;margin-bottom:15px;background:rgba(255,255,255,0.12);color:#00ffff;font-size:16px;}
.input-box::placeholder{color:rgba(0,255,255,0.7);}
.suggest-box{background:rgba(0,0,0,0.75);border-radius:12px;overflow:hidden;margin-top:-8px;margin-bottom:10px;}
.suggest-item{padding:12px;cursor:pointer;transition:0.3s;color:#00ffff;}
.suggest-item:hover{background:#1677ff;}
.btn{width:100%;padding:16px;margin-top:12px;border:none;border-radius:14px;font-size:17px;cursor:pointer;background:linear-gradient(135deg,#1677ff,#00c6ff);color:#00ffff;font-weight:bold;transition:0.3s;text-shadow:0 0 8px #00ffff;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,198,255,0.45),0 0 25px rgba(0,229,255,0.35);}
.info-card{position:absolute;top:110px;right:20px;width:340px;z-index:999;background:rgba(10,25,40,0.78);backdrop-filter:blur(18px);border-radius:24px;padding:24px;color:#00ffff;border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 30px rgba(0,0,0,0.45);}
.info-card h2{margin-bottom:20px;font-size:28px;}
.info-item{margin-bottom:22px;}
.label{font-size:16px;opacity:0.85;margin-bottom:6px;}
.value{font-size:32px;font-weight:bold;color:#00ffff;text-shadow:0 0 8px #00ffff,0 0 18px #00aaff;}
.coords{position:absolute;left:20px;bottom:20px;z-index:999;background:rgba(10,25,40,0.82);backdrop-filter:blur(10px);padding:12px 18px;border-radius:12px;color:#00ffff;border:1px solid rgba(255,255,255,0.15);}
</style>
</head>

<body>
<div class="header">🌍 全球城市关系可视化平台</div>

<div class="sidebar">
<h2>城市探索</h2>
<input id="city1" class="input-box" placeholder="输入起点城市" autocomplete="off">
<div id="suggest1" class="suggest-box"></div>
<input id="city2" class="input-box" placeholder="输入终点城市" autocomplete="off">
<div id="suggest2" class="suggest-box"></div>
<button class="btn" onclick="calculateDistance()">✈ 开始分析</button>
<button class="btn" onclick="clearAll()">🔄 重置地图</button>
</div>

<div class="info-card">
<h2>分析结果</h2>
<div class="info-item"><div class="label">城市距离</div><div class="value" id="distanceText">--</div></div>
<div class="info-item"><div class="label">预计飞行时间</div><div class="value" id="flightText">--</div></div>
<div class="info-item"><div class="label">异地恋指数</div><div class="value" id="loveText">--</div></div>
</div>

<div class="coords" id="coords">经纬度：</div>
<div id="map"></div>

<script>
let cityData = {};
let cityKeys = [];

Papa.parse("worldcities.csv", {
    download:true,
    header:true,
    dynamicTyping:true,
    complete:function(results){
        results.data.forEach(row=>{
            if(row.city_ascii && row.lat && row.lng){
                cityData[row.city_ascii.toLowerCase()] = {
                    name: row.city,
                    lon: parseFloat(row.lng),
                    lat: parseFloat(row.lat),
                    tz: row.timezone ? row.timezone : "UTC+0"
                };
            }
        });
        cityKeys = Object.keys(cityData);
        setupSuggest("city1","suggest1");
        setupSuggest("city2","suggest2");
        console.log("CSV loaded, total cities:", cityKeys.length);
    }
});

// 解析时区字符串为小时数
function parseTimeZone(tzStr) {
    if (!tzStr) return 0;
    const match = tzStr.match(/([+-])(\d+)/);
    if (!match) return 0;
    return parseInt(match[1] + match[2]);
}

function setupSuggest(inputId,suggestId){
    const input=document.getElementById(inputId);
    const suggest=document.getElementById(suggestId);
    input.addEventListener("input",function(){
        const value=this.value.toLowerCase();
        suggest.innerHTML="";
        if(value==="") return;
        cityKeys.forEach(key=>{
            const city=cityData[key];
            if(city.name.includes(this.value) || key.includes(this.value)){
                const div=document.createElement("div");
                div.className="suggest-item";
                div.innerHTML=city.name;
                div.onclick=function(){
                    input.value=key;
                    suggest.innerHTML="";
                };
                suggest.appendChild(div);
            }
        });
    });
}

const map=new ol.Map({
    target:'map',
    layers:[new ol.layer.Tile({source:new ol.source.OSM()})],
    view:new ol.View({center:ol.proj.fromLonLat([105,35]),zoom:2})
});

const vectorSource=new ol.source.Vector();
const vectorLayer=new ol.layer.Vector({source:vectorSource});
map.addLayer(vectorLayer);

function calculateDistance(){
    vectorSource.clear();
    const c1Key=document.getElementById('city1').value.toLowerCase();
    const c2Key=document.getElementById('city2').value.toLowerCase();
    if(!cityData[c1Key] || !cityData[c2Key]){
        alert("请输入正确的城市名称");
        return;
    }
    const c1=cityData[c1Key];
    const c2=cityData[c2Key];
    const startLonLat = [c1.lon, c1.lat];
    const endLonLat = [c2.lon, c2.lat];
    const startCoord=ol.proj.fromLonLat(startLonLat);
    const endCoord=ol.proj.fromLonLat(endLonLat);

    // 点样式
    const pointStyle=new ol.style.Style({image:new ol.style.Circle({radius:8,fill:new ol.style.Fill({color:'#00ffff'}),stroke:new ol.style.Stroke({color:'#00ffff',width:2})})});
    const startPoint=new ol.Feature({geometry:new ol.geom.Point(startCoord)});
    startPoint.setStyle(pointStyle);
    const endPoint=new ol.Feature({geometry:new ol.geom.Point(endCoord)});
    endPoint.setStyle(pointStyle);
    vectorSource.addFeature(startPoint);
    vectorSource.addFeature(endPoint);

    // 修复：动态计算正确的弧形飞线（解决方向问题）
    const dx = endCoord[0] - startCoord[0];
    const dy = endCoord[1] - startCoord[1];
    const dist = Math.sqrt(dx * dx + dy * dy);
    const arcHeight = dist * 0.2;
    const midX = (startCoord[0] + endCoord[0]) / 2 - dy * arcHeight / dist;
    const midY = (startCoord[1] + endCoord[1]) / 2 + dx * arcHeight / dist;
    
    const curve=new ol.geom.LineString([startCoord,[midX,midY],endCoord]);
    const line=new ol.Feature({geometry:curve});
    line.setStyle(new ol.style.Style({stroke:new ol.style.Stroke({color:'#00ffff',width:3,lineDash:[12,12]})}));
    vectorSource.addFeature(line);

    // 修复：飞机朝向飞行方向
    const rotation = Math.atan2(dy, dx);
    const plane=new ol.Feature({geometry:new ol.geom.Point(startCoord)});
    plane.setStyle(new ol.style.Style({
        text:new ol.style.Text({
            text:'✈',
            font:'30px sans-serif',
            fill:new ol.style.Fill({color:'#00ffff'}),
            rotation: -rotation
        })
    }));
    vectorSource.addFeature(plane);

    map.getView().fit(curve.getExtent(),{padding:[120,120,120,120],duration:1200});
    setTimeout(()=>animatePlane(plane,curve),1300);

    const distance=ol.sphere.getDistance(startLonLat, endLonLat);
    animateNumber("distanceText",(distance/1000).toFixed(0)," km");
    animateNumber("flightText",((distance/1000)/800).toFixed(1)," h");

   
    // 异地恋指数
    let love="";
    if(distance/1000<1000){love="😊 很近";}
    else if(distance/1000<5000){love="🥺 有点远";}
    else{love="💔 超远距离";}
    document.getElementById("loveText").innerHTML=love;
}

function animatePlane(plane,lineGeometry){
    let progress=0;
    const interval=setInterval(()=>{
        progress+=0.003;
        if(progress>=1){clearInterval(interval);}
        const coord=lineGeometry.getCoordinateAt(progress);
        plane.getGeometry().setCoordinates(coord);
    },16);
}

function animateNumber(id,target,unit){
    let current=0;const step=target/50;
    const interval=setInterval(()=>{
        current+=step;
        if(current>=target){current=target;clearInterval(interval);}
        document.getElementById(id).innerHTML=Math.floor(current)+unit;
    },20);
}

function clearAll(){
    vectorSource.clear();
    ["distanceText","flightText","timeText","loveText"].forEach(id=>document.getElementById(id).innerHTML="--");
    map.getView().animate({center:ol.proj.fromLonLat([105,35]),zoom:2,duration:1000});
}

map.on('pointermove',function(evt){
    const coord=ol.proj.toLonLat(evt.coordinate);
    document.getElementById('coords').innerHTML="经度："+coord[0].toFixed(4)+"  纬度："+coord[1].toFixed(4);
});
</script>
</body>
</html>
